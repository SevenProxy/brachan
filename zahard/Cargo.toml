[package]
name = "zahard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
password-hash = "0.6.1"
rand = "0.10.3"
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "with-chrono", "sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1.44"
