services:
  postgres:
    image: postgres:17-alpine
    container_name: brachan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: hRjV6UVn59GDogwMjQTY
      POSTGRES_DB: brachan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brachan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
